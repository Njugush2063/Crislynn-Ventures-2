<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'DM Sans',sans-serif;
}

.exp-hero{
height:90vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
position:relative;
overflow:hidden;
}

/* video behaves like background */

.exp-hero video{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
display:none;
}

/* image behaves like background */

.exp-hero img{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:0;
display:none;
}

/* ✨ smooth fade effect */

.exp-hero video,
.exp-hero img{
transition: opacity 0.6s ease;
}

/* overlay */

.exp-hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.35);
z-index:1;
}

/* text */

.exp-hero-inner{
position:relative;
z-index:2;
max-width:700px;
}

</style>

</head>

<body>

<section class="exp-hero">

<video id="heroVideo" autoplay muted loop playsinline></video>

<img id="heroImage" />

<div class="exp-hero-inner">
<h1 id="expTitle"></h1>
<p id="expDesc"></p>
</div>

</section>


<script>

const data = JSON.parse(localStorage.getItem("selectedExperience"));

const hero = document.querySelector(".exp-hero");
const video = document.getElementById("heroVideo");
const image = document.getElementById("heroImage");

if(data){

document.getElementById("expTitle").innerText = data.title;
document.getElementById("expDesc").innerText = data.desc;

/* ✅ improved safe video check */

if(data.video && data.video !== "null" && data.video !== ""){

video.innerHTML = `<source src="${data.video}" type="video/mp4">`;
video.load();

video.style.display = "block";
video.style.opacity = "1";

image.style.display = "none";
image.style.opacity = "0";

}else if(data.image){

image.src = data.image;

image.style.display = "block";
image.style.opacity = "1";

video.style.display = "none";
video.style.opacity = "0";

}

}else{

document.getElementById("expTitle").innerText = "Experience";
document.getElementById("expDesc").innerText = "Details coming soon.";

}

</script>

</body>

</html>
